[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "a3-outcome-stack"
version = "0.2.0"
description = "A reproducible EduLite A3 learning stack with action-outcome evaluation"
requires-python = ">=3.11"

[project.scripts]
a3-outcome-stack = "a3_outcome_stack.ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

